services:
  - type: web
    name: jarvis-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: JARVIS_DB_PATH
        value: jarvis_memory.db
      - key: ALLOWED_ORIGINS
        value: "https://jarvis-ai-59qd.onrender.com,http://localhost:3000,http://127.0.0.1:3000"
      - key: JARVIS_JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434

  - type: redis
    name: jarvis-redis
    plan: free
    ipAllowList: []
