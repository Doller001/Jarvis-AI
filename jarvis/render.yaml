services:
  - type: web
    name: jarvis-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: JARVIS_DB_PATH
        value: jarvis_memory.db
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
